<style>

  :root {

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  html, body { height: 100%; }
  body { background: var(--sky-top); color: var(--text); font-family: var(--face); font-size: 1rem; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow: hidden; }
  .page { position: relative; height: 100%; min-height: 560px; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
  .sky { position: relative; min-height: 0; }
  .scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .top, .bottom { position: relative; z-index: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  @media (min-width: 720px) { .top, .bottom { padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); } }
  .top { position: absolute; top: 0; left: 0; right: 0; padding-block: 22px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem 1.5rem; flex-wrap: wrap; }
  .name { margin: 0; font-size: 1.25rem; font-weight: 600; font-variation-settings: "wdth" 118; letter-spacing: -0.005em; }
  .bottom { background: var(--ground); padding-block: 4px 26px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 0.75rem 2rem; }
  .bottom p { margin: 0; }
  .about { max-width: 34ch; }
  .lines { display: grid; gap: 0.2rem; font-size: 0.9375rem; color: var(--text-soft); }
  @media (min-width: 720px) { .lines { justify-items: end; text-align: right; } }
  .email { display: inline-flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
  .lines a { color: var(--text); text-decoration-color: var(--m1); text-underline-offset: 4px; }
  button.copy { font: inherit; font-size: 0.8125rem; color: var(--text); background: rgba(255,255,255,0.06); border: 1px solid var(--rule); border-radius: 6px; padding: 0.05rem 0.55rem; cursor: pointer; }
  button.copy:focus-visible, .lines a:focus-visible { outline: 2px solid var(--m1); outline-offset: 3px; }
  @media (prefers-reduced-motion: no-preference) {
    .tw { animation: tw var(--d) ease-in-out var(--o) infinite alternate; }
    .drift { animation: drift var(--d) ease-in-out infinite alternate; }
  }
  .drift { transform-box: view-box; }
  @keyframes tw { from { opacity: var(--a); } to { opacity: calc(var(--a) * 0.25); } }
  @keyframes drift { from { transform: translateX(calc(var(--x) * -1)); } to { transform: translateX(var(--x)); } }
</style>
